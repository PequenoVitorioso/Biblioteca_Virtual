<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Biblioteca Virtual</title>

    <!-- Carrega global.css, navigation_bar.css e footer.css -->
    <script src="../../js/load-css.js" defer></script>
    <link rel="stylesheet" href="login.css">

</head>
<body>
    <header class="navigation-bar">
        <a class="brand-logo" href="../Home/index.html" aria-label="Biblioteca Virtual - página inicial">
            Biblioteca Virtual
        </a>

        <nav class="nav-links" aria-label="Navegação principal">
            <a href="../Home/index.html">Página inicial</a>
        </nav>
    </header>

    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <span class="badge badge-blue">Sua estante digital</span>

            <h1 class="login-heading" id="login-title">Boas-vindas!</h1>
            <p class="login-description">
                Entre na sua conta para organizar suas obras favoritas.
            </p>

            <form class="login-form" action="#" method="post">
                <div class="form-group">
                    <label class="form-label" for="name">Nome</label>
                    <input
                        class="form-control"
                        type="text"
                        id="name"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">E-mail</label>
                    <input
                        class="form-control"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="senha">Senha</label>
                    <input
                        class="form-control"
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="login-options">
                    <label class="form-check" for="remember">
                        <input type="checkbox" id="remember" name="lembrar">
                        Manter conectado
                    </label>
                    <a href="#" aria-label="Recuperar senha">Esqueci minha senha</a>
                </div>

                <button class="btn btn-primary btn-block" type="submit">
                    Entrar na minha conta
                </button>
            </form>

            <a class="login-home-link" href="../Home/index.html">
                Voltar para a página inicial
            </a>
        </section>
    </main>

    <footer class="login-footer">
        Biblioteca Virtual — organize e acompanhe suas obras favoritas.
    </footer>
</body>
</html>
