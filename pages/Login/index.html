<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Começar | Minha Estante</title>

    <!-- Carrega global.css, navigation_bar.css e footer.css -->
    <script src="../../js/load-css.js" defer></script>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>

</head>
<body>
    <header class="navigation-bar">
        <a class="brand-logo" href="../Home/index.html" aria-label="Minha Estante - página inicial">
            Minha Estante
        </a>

        <nav class="nav-links" aria-label="Navegação principal">
            <a href="../Home/index.html">Página inicial</a>
        </nav>
    </header>

    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <span class="badge badge-blue">Sua estante digital</span>

            <h1 class="login-heading" id="login-title">Comece sua estante</h1>
            <p class="login-description">
                Crie um perfil local para organizar suas obras. Nenhuma conta online é criada.
            </p>

            <form class="login-form" id="local-login-form">
                <div class="form-group">
                    <label class="form-label" for="name">Nome</label>
                    <input
                        class="form-control"
                        type="text"
                        id="name"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="login-options">
                    <label class="form-check" for="remember">
                        <input type="checkbox" id="remember" name="lembrar" checked>
                        Guardar neste navegador
                    </label>
                </div>

                <button class="btn btn-primary btn-block" type="submit">
                    Continuar para meu perfil
                </button>
                <p class="login-status" role="status" aria-live="polite"></p>
            </form>

            <a class="login-home-link" href="../Home/index.html">
                Voltar para a página inicial
            </a>
        </section>
    </main>

    <footer class="login-footer">
        Minha Estante — organize e acompanhe suas obras favoritas.
    </footer>
</body>
</html>
